<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mystery Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2728%27%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="description" content="An episodic, cinematic murder mystery. Three episodes, each ending on a cliffhanger.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <canvas id="fx"></canvas>
  <div id="chars"></div>
  <div id="tint"></div>
  <div class="vig"></div>
  <div class="grain"></div>
  <div id="roster"></div>
  <div class="bars top"></div>
  <div class="bars bot"></div>
  <div id="slate"></div>
  <div id="dialog"><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
  <div id="choices"></div>
  <div id="tbc"></div>
  <div id="card"></div>
  <div id="flash"></div>
  <div id="hud">
    <span id="hp"></span>
    <button id="bFile">Case file</button>
    <button id="bAuto" class="on">Auto: on</button>
    <button id="bSound">Sound: on</button>
    <button id="bVoice" class="on">Voice: on</button>
    <button id="bMenu">Menu</button>
  </div>
  <div id="overlay"></div>
  <div id="fadeblk"></div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script src="js/cases.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/voice.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/room.js"></script>
<script src="js/story.js"></script>
<script src="js/cases/kit.js"></script>
<script src="js/cases/silverblaze.js"></script>
<script src="js/cases/boscombe.js"></script>
<script src="js/cases/abbey.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
