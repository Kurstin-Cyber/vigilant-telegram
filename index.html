<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Death at Blackwood Manor</title>
<style>
:root {
  --bg: #14110f; --panel: #1e1915; --panel2: #292219; --line: #3b3126;
  --ink: #ece3d3; --dim: #a89c88; --gold: #d4a64a; --red: #c8553d; --green: #7fae6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.55 Georgia, 'Times New Roman', serif; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-weight: normal; margin: 0; letter-spacing: .02em; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; }

header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 18px 0 12px; }
header h1 { font-size: 1.35rem; color: var(--gold); }
header small { display: block; color: var(--dim); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
.btn:hover { border-color: var(--gold); }
.btn.gold { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: bold; }
.btn.red { border-color: var(--red); color: #f0b3a5; }
.btn[disabled] { opacity: .45; cursor: default; }

nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
nav button { white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--dim); }
nav button.on { color: #1a1408; background: var(--gold); border-color: var(--gold); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 14px; }
.card h2 { font-size: 1.3rem; margin-bottom: 4px; }
.card p.desc { color: var(--dim); margin: 0 0 14px; font-style: italic; }
.label { color: var(--dim); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin: 14px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.spot, .person { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.spot:hover, .person:hover { border-color: var(--gold); }
.spot .ic, .person .ic { font-size: 1.5rem; }
.spot.done { opacity: .6; }
.spot .tick { margin-left: auto; color: var(--green); }
.person small { display: block; color: var(--dim); font-size: .78rem; }

.feed .item { border-left: 3px solid var(--gold); padding: 4px 0 4px 12px; margin: 12px 0; }
.feed .item:first-child { border-color: var(--red); }
.feed .item b { color: var(--gold); display: block; font-weight: normal; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.empty { color: var(--dim); font-style: italic; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; width: 100%; max-width: 680px; padding: 20px; margin: 4vh 0; }
.modal h2 { color: var(--gold); margin-bottom: 10px; }
.modal .close { float: right; background: none; border: 0; color: var(--dim); font-size: 1.4rem; line-height: 1; }
.modal p { margin: 0 0 12px; }

.tx { max-height: 260px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.tx .you { color: var(--dim); font-style: italic; margin-top: 10px; }
.tx .them { margin: 2px 0 0 12px; }
.topics { display: flex; flex-direction: column; gap: 6px; }
.topics button { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.topics button:hover:not([disabled]) { border-color: var(--gold); }
.topics button.asked { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .88rem; }
.chips button:hover:not([disabled]) { border-color: var(--gold); }
.chips button[disabled] { opacity: .4; cursor: default; }

.clue { background: var(--panel2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.clue b { color: var(--gold); font-weight: normal; }
.clue small { color: var(--dim); }
.board { display: grid; gap: 8px; }
.board .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
.mark { min-width: 96px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); padding: 4px 10px; font-size: .85rem; }
.mark.s1 { border-color: var(--red); color: #f0b3a5; }
.mark.s2 { border-color: var(--green); color: #bfe0b2; }

fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; padding: 8px 12px 10px; }
legend { color: var(--gold); padding: 0 6px; }
fieldset label { display: block; padding: 4px 0; cursor: pointer; }
fieldset input { margin-right: 8px; accent-color: var(--gold); }
.result { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.stars { color: var(--gold); letter-spacing: .2em; }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--gold); color: #1a1408; padding: 8px 18px; border-radius: 999px; font-weight: bold; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>
<script>
'use strict';

/* ---------- Story data ---------- */

const CLUES = {
  body: { name: `Edmund's body`, type: 'Evidence', where: 'Study', text: `Edmund Blackwood sits slumped in his leather chair. No wound, no blood, no sign of a struggle. His lips have a bluish tinge. This looks like poison, not violence.` },
  glasses: { name: 'Two brandy glasses', type: 'Evidence', where: 'Study', text: `Two used crystal glasses on the desk. One holds greenish dregs that smell faintly bitter; the other is clean. Edmund shared a drink with someone he trusted, and that someone walked away unharmed.` },
  watch: { name: 'Smashed pocket watch', type: 'Evidence', where: 'Study', text: `Edmund's gold watch lies on the floor, glass cracked, hands frozen at 9:12. It must have fallen when he collapsed.` },
  ledger: { name: 'Burnt ledger scrap', type: 'Evidence', where: 'Study', text: `A half-burned scrap in the grate: "...Hartley Orphans' Fund... withdrawn, J.H.... £4,200... £3,800..." Someone tried to destroy it and failed.` },
  key: { name: 'Small brass key', type: 'Evidence', where: 'Library', text: `Hidden behind a copy of Bleak House: a small brass key stamped with the letter S.` },
  letter: { name: 'Unsent letter to solicitor', type: 'Evidence', where: 'Study', text: `"Mr. Crane. On Monday I will take the thefts from the Hartley Orphans' Fund to the magistrate. The signatures on those withdrawals are forged. I have known the man thirty years and it grieves me. E.B."` },
  vivianLetter: { name: `Vivian's allowance letter`, type: 'Evidence', where: 'Library', text: `A letter from Edmund to Vivian, dated last week: her allowance is cut to nothing until she "shows some sense". The paper has tear stains.` },
  vial: { name: `Hale's digitalis vial`, type: 'Evidence', where: 'Conservatory', text: `Dr. Hale's black bag, open on a bench. A vial of "Tincture of Digitalis, J. Hale" is nearly empty, with far more missing than any heart patient would need. In quantity, digitalis stops a heart.` },
  ashtray: { name: 'Cold ashtray', type: 'Evidence', where: 'Conservatory', text: `A dusty ashtray holding one old, cold stub. No fresh ash and no smell of cigar. Nobody has smoked in this room tonight.` },

  fundTalk: { name: `Margaret: "the fund"`, type: 'Testimony', where: 'Dining Room', text: `Margaret says Edmund spent weeks muttering about "a rot in the fund", and that Dr. Hale handled the charity's books.` },
  vivianAlibi: { name: `Vivian's alibi`, type: 'Testimony', where: 'Library', text: `Vivian says she was alone in the library from half past eight until the gong at half past nine.` },
  haleAlibi: { name: `Hale's alibi`, type: 'Testimony', where: 'Conservatory', text: `Hale says he spent the evening in the conservatory smoking a cigar, and that Vivian kept him company until half past nine.` },
  haleVivian: { name: 'Vivian never saw Hale', type: 'Testimony', where: 'Library', text: `Vivian says she has not seen Dr. Hale since drinks before dinner. Hale's alibi relied on her.` },
  digitalisRx: { name: 'Hale prescribed digitalis', type: 'Testimony', where: 'Conservatory', text: `Hale admits he prescribed Edmund digitalis for a mild heart condition.` },
  decanterClean: { name: 'The decanter was sealed', type: 'Testimony', where: 'Kitchen', text: `Mrs. Dobbs says a freshly sealed decanter and a single glass went to the study at ten to nine. Only one glass was sent.` },
  dobbsGlass: { name: 'Hale fetched a glass', type: 'Testimony', where: 'Kitchen', text: `Mrs. Dobbs says Dr. Hale came to the kitchen around nine for a clean glass, claiming Edmund wanted company for a nightcap.` },
  penSaw: { name: 'Pennington saw Hale', type: 'Testimony', where: 'Kitchen', text: `Pennington saw Dr. Hale enter the study at five past nine carrying a glass of his own, and come out around twenty past.` },
  confession: { name: `Hale's confession`, type: 'Testimony', where: 'Conservatory', text: `Confronted, Dr. Hale admitted everything.` }
};

const ROOMS = {
  study: {
    name: 'The Study', icon: '🕯️',
    desc: `Leather, brass and the cold smell of ash. The door was locked from inside until the butler forced it.`,
    spots: [
      { id: 'body', label: 'Examine the body', icon: '🪑', text: CLUES.body.text, gives: 'body' },
      { id: 'desk', label: 'Search the desk', icon: '🥃', text: CLUES.glasses.text, gives: 'glasses' },
      { id: 'floor', label: 'Look at the floor', icon: '⌚', text: CLUES.watch.text, gives: 'watch' },
      { id: 'grate', label: 'Check the fireplace', icon: '🔥', text: CLUES.ledger.text, gives: 'ledger' },
      { id: 'drawer', label: 'Locked desk drawer', icon: '🗄️', req: 'key', locked: `The drawer is locked tight. You'll need a key.`, text: CLUES.letter.text, gives: 'letter' },
      { id: 'opener', label: 'Letter opener', icon: '🗡️', text: `Clean steel, no blood, still in its holder. Whoever killed Edmund did not use a blade.` },
      { id: 'window', label: 'The window', icon: '🪟', text: `Latched from the inside, with unbroken snow on the sill. Nobody came or went this way, so the killer was already in the house.` }
    ]
  },
  library: {
    name: 'The Library', icon: '📚',
    desc: `Floor-to-ceiling shelves and a fire burning low. Vivian sits with a book she is not reading.`,
    spots: [
      { id: 'shelf', label: 'Search the shelves', icon: '📖', text: CLUES.key.text, gives: 'key' },
      { id: 'writing', label: 'Writing desk', icon: '✉️', text: CLUES.vivianLetter.text, gives: 'vivianLetter' },
      { id: 'clock', label: 'Grandfather clock', icon: '🕰️', text: `It chimes the quarter hours loudly. Anyone in this room would have heard the gong at half past nine.` }
    ]
  },
  conservatory: {
    name: 'The Conservatory', icon: '🌿',
    desc: `Glass walls, damp air and rows of orchids. Dr. Hale is polishing his spectacles.`,
    spots: [
      { id: 'bag', label: `Dr. Hale's bag`, icon: '👜', text: CLUES.vial.text, gives: 'vial' },
      { id: 'ashtray', label: 'The ashtray', icon: '🚬', text: CLUES.ashtray.text, gives: 'ashtray' },
      { id: 'orchids', label: 'The orchids', icon: '🌺', text: `Edmund's prize orchids. The soil is undisturbed and nothing is hidden here.` }
    ]
  },
  kitchen: {
    name: 'The Kitchen', icon: '🍳',
    desc: `Copper pans and the smell of roast. Mrs. Dobbs and Pennington keep their voices low.`,
    spots: [
      { id: 'rack', label: 'Glass rack', icon: '🥂', text: `A rack of matching crystal glasses, the same pattern as the two in the study.` },
      { id: 'menu', label: 'Dinner menu', icon: '📋', text: `Dinner was served at half past eight. Dessert was due at a quarter to ten.` }
    ]
  },
  dining: {
    name: 'The Dining Room', icon: '🍽️',
    desc: `A long table, half-finished plates and an empty chair at its head.`,
    spots: [
      { id: 'table', label: 'The table', icon: '🍷', text: `Six places were laid. Edmund's chair and Dr. Hale's are both empty, and Hale's dessert fork is untouched.` },
      { id: 'sideboard', label: 'Sideboard', icon: '🕯️', text: `Candles, linens and the guest list: Lady Margaret, Vivian Cross, Dr. Julian Hale and Edmund, with Pennington attending.` }
    ]
  }
};

const PEOPLE = {
  margaret: {
    name: 'Lady Margaret Blackwood', role: `The widow`, icon: '👵', room: 'dining',
    intro: `"Inspector. I can't believe it. Ask whatever you must."`,
    topics: [
      { id: 'where', q: `Where were you at nine?`, a: `"In the drawing room with a headache. Alone, I'm afraid. I know how that sounds."` },
      { id: 'marriage', q: `How were things between you and Edmund?`, a: `"Civil. He was a hard man but not a cruel one. We had our differences, like any marriage thirty years old."` },
      { id: 'worry', q: `Did Edmund seem troubled lately?`, a: `"He shut himself in the study for weeks, muttering about 'a rot in the fund'. He said Dr. Hale had been such a help with the charity's books. Hale handles those accounts."`, gives: 'fundTalk' }
    ],
    present: {
      vivianLetter: { a: `"Poor Vivian. Edmund was too harsh. But she'd never hurt him, Inspector. She loved her uncle."` },
      ledger: { a: `"The Hartley Orphans' Fund? Edmund was so proud of it. Whatever happened to that fund would have broken his heart."` },
      letter: { a: `"He told me only that he'd found 'a rot in the fund'. He wouldn't say whose doing it was. Oh, Edmund."` },
      glasses: { a: `"Edmund never drank alone before dinner was done. He'd have wanted a friend with him."` }
    },
    fallback: `Margaret shakes her head. "I don't see what that has to do with me."`
  },
  vivian: {
    name: 'Vivian Cross', role: `The niece`, icon: '👩', room: 'library',
    intro: `"I didn't do it. Whatever my uncle did to my allowance, I didn't do it."`,
    topics: [
      { id: 'where', q: `Where were you at nine?`, a: `"Right here in the library from half past eight until the gong at half past nine. Alone, reading."`, gives: 'vivianAlibi' },
      { id: 'money', q: `Your uncle cut your allowance, didn't he?`, a: `"Yes, and I was furious. I'm not proud of it. But furious isn't murderous."` },
      { id: 'hale', q: `Did you see Dr. Hale after dinner began?`, req: ['haleAlibi'], a: `"Dr. Hale? No. I haven't seen him since drinks before dinner. Why, what did he say?"`, gives: 'haleVivian' }
    ],
    present: {
      vivianLetter: { a: `"Yes, that's mine. Check the date though. It came last week and I'd already accepted it. I had no reason to kill him now."` },
      key: { a: `"Behind the Dickens? Uncle hid his study key there. He thought nobody knew. I never touched it."` },
      haleAlibi: { a: `"Conservatory? With me? Then Dr. Hale is mistaken. I was alone all evening."` }
    },
    fallback: `Vivian shrugs, pale. "I don't know anything about that."`
  },
  hale: {
    name: 'Dr. Julian Hale', role: `The family physician`, icon: '🧑‍⚕️', room: 'conservatory',
    intro: `"Dreadful business, Inspector. Dreadful. Edmund was my oldest friend."`,
    topics: [
      { id: 'where', q: `Where were you at nine?`, a: `"Here in the conservatory, smoking a cigar among the orchids. Miss Cross kept me company until the gong at half past nine."`, gives: 'haleAlibi' },
      { id: 'friend', q: `How well did you know Edmund?`, a: `"Thirty years his physician and his friend. I'd have done anything for him."` },
      { id: 'heart', q: `Did Edmund have heart trouble?`, a: `"Mild. I prescribed digitalis for it, as any doctor would."`, gives: 'digitalisRx' }
    ],
    present: {
      body: { a: `"A heart attack, surely. Poor Edmund." He cannot quite look at you.` },
      watch: { a: `"9:12? I was in here at 9:12. Ask anyone." Nobody can be asked.` },
      glasses: { a: `"Two glasses? Edmund liked company. Half the county drank with him." He smiles, but it doesn't reach his eyes.` },
      ledger: { a: `"A scrap of paper? J.H. could be a hundred people in this county." He adjusts his collar.` },
      ashtray: { a: `"I... must have smoked outside, on the terrace. Or perhaps I only meant to smoke. Does it matter?"` },
      vial: { a: `"My bag? I carry digitalis, as any physician would. If someone helped themselves, that's hardly my fault." His hand trembles.` },
      letter: { a: `"Thirty years, and he wrote that? Forged signatures? Lies! He was ill, he was confused..." He stops and wets his lips. "Where did you find that?"` },
      haleVivian: { a: `"Miss Cross must be mistaken. Or perhaps she lost track of the time." He is sweating now.` },
      penSaw: { a: null, confess: true },
      dobbsGlass: { a: null, confess: true }
    },
    confession: `Hale's shoulders sag. "He called me in to say goodbye to thirty years of friendship. One last drink, he said, for old times. I had already put the digitalis in my own glass, and I switched them when he turned to the decanter. I couldn't let him ruin me, Inspector. I couldn't."`,
    fallback: `Hale blinks. "I'm afraid I don't follow."`
  },
  pennington: {
    name: 'Pennington', role: `The butler`, icon: '🤵', room: 'kitchen',
    intro: `"Inspector. It was I who found the Master. I shall never forget it."`,
    topics: [
      { id: 'where', q: `What were you doing around nine?`, a: `"Serving dinner until the Master left the table at five to nine. Afterwards I was in the pantry polishing silver."` },
      { id: 'brandy', q: `Who prepared the brandy?`, a: `"I did, sir. A fresh sealed decanter and a single glass, placed on the study sideboard at ten to nine."` },
      { id: 'saw', q: `Did you see anyone near the study?`, a: `"I'd rather not speak out of turn, Inspector. Perhaps if I knew what you'd found in there..."` }
    ],
    present: {
      glasses: { a: `Pennington exhales. "Two glasses. Then I must speak. I saw Dr. Hale go into the study at five past nine carrying a glass of his own. He came out about twenty past. I thought nothing of it, he is a guest and the Master's friend."`, gives: 'penSaw' },
      watch: { a: `"9:12. I heard a crash from the study about then. I took it for a tray falling and did not look. I wish I had."` },
      body: { a: `"I forced the door myself, sir. It was locked from inside. I shall not forget his face."` }
    },
    fallback: `Pennington lowers his eyes. "I'm afraid I cannot help with that, sir."`
  },
  dobbs: {
    name: 'Mrs. Dobbs', role: `The cook`, icon: '👩‍🍳', room: 'kitchen',
    intro: `"I've cooked for the Blackwoods twenty years. Whatever's happened, it wasn't in my kitchen."`,
    topics: [
      { id: 'decanter', q: `Could the brandy have been tampered with?`, a: `"Not here. Pennington took a freshly sealed decanter at ten to nine, and one glass on the tray. One, mind."`, gives: 'decanterClean' },
      { id: 'odd', q: `Anything odd tonight?`, a: `"Odd? A man died upstairs, Inspector. It's all odd."` }
    ],
    present: {
      glasses: { a: `"Two glasses? I sent only one. But Dr. Hale popped in about nine asking for a clean glass. Said Mr. Edmund wanted company for a nightcap. I handed him one from the rack."`, gives: 'dobbsGlass' },
      ledger: { a: `"Papers aren't my business, dear. Ask the doctor, he's always at those books."` }
    },
    fallback: `Mrs. Dobbs wipes her hands. "That's none of my business, dear."`
  }
};

const SUSPECTS = ['margaret', 'vivian', 'hale', 'pennington'];
const WEAPONS = ['Digitalis in the brandy', 'Curtain cord', 'Fireplace poker', 'Letter opener'];
const MOTIVES = [`Inherit Edmund's fortune`, `Cover up theft from the Orphans' Fund`, 'Jealousy over an affair', 'Revenge for a dismissal'];
const SOLUTION = { who: 'hale', weapon: 'Digitalis in the brandy', motive: `Cover up theft from the Orphans' Fund` };

const MARK_LABELS = ['Unmarked', 'Suspect', 'Cleared'];

const HINTS = [
  [() => !has('body'), `Start where it happened. Examine the body in the study.`],
  [() => !has('glasses'), `Search the desk in the study. How did Edmund die, and who drank with him?`],
  [() => !has('key'), `The locked drawer in the study needs a key. Search the library shelves.`],
  [() => !has('letter'), `You have the key now. Open the locked drawer in the study.`],
  [() => !has('haleAlibi'), `Ask each suspect where they were at nine, starting in the conservatory.`],
  [() => !has('haleVivian'), `Dr. Hale named a witness for his alibi. Ask Vivian about him.`],
  [() => !has('ashtray'), `Hale says he smoked. Does the conservatory agree?`],
  [() => !has('vial'), `Look in Dr. Hale's medical bag.`],
  [() => !has('penSaw') && !has('dobbsGlass'), `Show the two glasses to the staff in the kitchen.`],
  [() => true, `You have enough. Think about who, how and why, then make your accusation.`]
];

/* ---------- State ---------- */

const SAVE_KEY = 'blackwood-manor-v1';
const app = document.getElementById('app');

function fresh() {
  return { room: 'study', clues: [], done: {}, tx: {}, feed: [], marks: {}, attempts: 3, actions: 0, hints: 0, acc: {}, ui: 'intro', result: null, over: null };
}
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.clues) return s; } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

let S = loadState() || fresh();
const has = id => S.clues.includes(id);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
function addClue(id) {
  if (!id || has(id)) return;
  S.clues.push(id);
  toast('🔎 New clue: ' + CLUES[id].name);
}
function show(h, t) {
  S.feed = S.feed.filter(f => f.h !== h || f.t !== t);
  S.feed.unshift({ h, t });
  S.feed = S.feed.slice(0, 12);
}

/* ---------- Actions ---------- */

function searchSpot(roomId, spotId) {
  const spot = ROOMS[roomId].spots.find(s => s.id === spotId);
  if (spot.req && !has(spot.req)) { show(spot.label, spot.locked); return; }
  const key = roomId + ':' + spotId;
  if (!S.done[key]) { S.done[key] = 1; S.actions++; }
  show(spot.label, spot.text);
  addClue(spot.gives);
}

function ask(pid, tid) {
  const p = PEOPLE[pid], t = p.topics.find(x => x.id === tid);
  const key = 'q:' + pid + ':' + tid;
  if (S.done[key]) return;
  S.done[key] = 1; S.actions++;
  (S.tx[pid] = S.tx[pid] || []).push({ q: t.q, a: t.a });
  addClue(t.gives);
}

function present(pid, cid) {
  const p = PEOPLE[pid];
  const key = 'p:' + pid + ':' + cid;
  if (S.done[key]) return;
  S.done[key] = 1; S.actions++;
  const r = p.present[cid];
  let a = r ? r.a : p.fallback;
  if (r && r.confess) { a = p.confession; addClue('confession'); }
  (S.tx[pid] = S.tx[pid] || []).push({ q: 'You show: ' + CLUES[cid].name, a });
  if (r && r.gives) addClue(r.gives);
}

function hint() {
  S.hints++;
  const h = HINTS.find(x => x[0]());
  show('Hint', h[1]);
}

function accuse() {
  const a = S.acc;
  if (!a.who || !a.weapon || !a.motive) { toast('Choose a suspect, weapon and motive'); return; }
  const right = (a.who === SOLUTION.who) + (a.weapon === SOLUTION.weapon) + (a.motive === SOLUTION.motive);
  S.attempts--;
  if (right === 3) {
    S.over = 'win'; S.ui = 'end';
  } else if (S.attempts <= 0) {
    S.over = 'lose'; S.ui = 'end';
  } else {
    S.result = right;
  }
}

function reset() {
  S = fresh(); S.ui = 'intro';
}

const ACTIONS = {
  begin() { S.ui = null; },
  go(d) { S.room = d.id; },
  search(d) { searchSpot(S.room, d.id); },
  talk(d) { S.ui = 'talk:' + d.id; },
  ask(d) { ask(d.p, d.id); },
  present(d) { present(d.p, d.id); },
  notebook() { S.ui = 'notebook'; },
  accuse() { S.ui = 'accuse'; S.result = null; },
  submit() { accuse(); },
  mark(d) { S.marks[d.id] = ((S.marks[d.id] || 0) + 1) % 3; },
  hint() { hint(); },
  close() { S.ui = null; },
  restart() { if (S.over || confirm('Start a new case? Your progress will be lost.')) reset(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    if (b.disabled) return;
    ACTIONS[b.dataset.act](b.dataset);
    save(); render(); return;
  }
  if (e.target.classList.contains('overlay') && S.ui && S.ui !== 'intro' && S.ui !== 'end') { S.ui = null; save(); render(); }
});
document.addEventListener('change', e => {
  const r = e.target.closest('[data-acc]');
  if (r) { S.acc[r.dataset.acc] = r.value; save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.ui && S.ui !== 'intro' && S.ui !== 'end') { S.ui = null; save(); render(); }
});

/* ---------- Rendering ---------- */

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function render() {
  const r = ROOMS[S.room];
  const people = Object.keys(PEOPLE).filter(id => PEOPLE[id].room === S.room);
  const total = Object.keys(CLUES).length;
  app.innerHTML = `
    <header>
      <div><h1>Death at Blackwood Manor</h1><small>Clues ${S.clues.length}/${total} &middot; Moves ${S.actions}</small></div>
      <div class="tools">
        <button class="btn" data-act="hint">Hint</button>
        <button class="btn" data-act="notebook">Notebook</button>
        <button class="btn red" data-act="accuse">Accuse</button>
      </div>
    </header>
    <nav>${Object.entries(ROOMS).map(([id, rm]) => `<button class="${id === S.room ? 'on' : ''}" data-act="go" data-id="${id}">${rm.icon} ${esc(rm.name)}</button>`).join('')}</nav>
    <section class="card">
      <h2>${r.icon} ${esc(r.name)}</h2>
      <p class="desc">${esc(r.desc)}</p>
      <div class="label">Investigate</div>
      <div class="grid">${r.spots.map(s => {
        const d = S.done[S.room + ':' + s.id];
        return `<button class="spot ${d ? 'done' : ''}" data-act="search" data-id="${s.id}"><span class="ic">${s.icon}</span><span>${esc(s.label)}</span>${d ? '<span class="tick">✓</span>' : ''}</button>`;
      }).join('')}</div>
      ${people.length ? `<div class="label">People here</div><div class="grid">${people.map(id => `<button class="person" data-act="talk" data-id="${id}"><span class="ic">${PEOPLE[id].icon}</span><span>${esc(PEOPLE[id].name)}<small>${esc(PEOPLE[id].role)}</small></span></button>`).join('')}</div>` : ''}
    </section>
    <section class="card feed">
      <div class="label" style="margin-top:0">Case log</div>
      ${S.feed.length ? S.feed.map(f => `<div class="item"><b>${esc(f.h)}</b>${esc(f.t)}</div>`).join('') : '<div class="empty">Search the room or question someone. Findings appear here.</div>'}
    </section>
    ${modal()}`;
  const tx = app.querySelector('.tx');
  if (tx) tx.scrollTop = tx.scrollHeight;
}

function wrapModal(body, closable = true) {
  return `<div class="overlay"><div class="modal">${closable ? '<button class="close" data-act="close" aria-label="Close">×</button>' : ''}${body}</div></div>`;
}

function modal() {
  const ui = S.ui;
  if (!ui) return '';
  if (ui === 'intro') return wrapModal(`
    <h2>Death at Blackwood Manor</h2>
    <p>December, 1926. Snow has sealed the roads around Blackwood Manor. At 9:40 tonight, philanthropist Edmund Blackwood was found dead in his locked study, with dinner guests still at the table.</p>
    <p>You are the inspector. Nobody can leave. One of the four people under this roof is a killer: the widow, the niece, the family doctor, or the butler. Search rooms, question people, show them what you've found, and catch the lies.</p>
    <p>When you're ready, name the <b>culprit</b>, the <b>weapon</b> and the <b>motive</b>. You get three accusations.</p>
    <button class="btn gold" data-act="begin">Begin investigation</button>`, false);

  if (ui.startsWith('talk:')) {
    const pid = ui.slice(5), p = PEOPLE[pid], tx = S.tx[pid] || [];
    const topics = p.topics.filter(t => !t.req || t.req.every(has));
    return wrapModal(`
      <h2>${p.icon} ${esc(p.name)}</h2>
      <div class="tx">${tx.length ? tx.map(m => `<div class="you">${esc(m.q)}</div><div class="them">${esc(m.a)}</div>`).join('') : `<div class="them">${esc(p.intro)}</div>`}</div>
      <div class="label">Ask</div>
      <div class="topics">${topics.map(t => {
        const asked = S.done['q:' + pid + ':' + t.id];
        return `<button class="${asked ? 'asked' : ''}" data-act="ask" data-p="${pid}" data-id="${t.id}" ${asked ? 'disabled' : ''}>${asked ? '✓ ' : ''}${esc(t.q)}</button>`;
      }).join('')}</div>
      <div class="label">Show evidence</div>
      ${S.clues.length ? `<div class="chips">${S.clues.map(c => {
        const shown = S.done['p:' + pid + ':' + c];
        return `<button data-act="present" data-p="${pid}" data-id="${c}" ${shown ? 'disabled' : ''}>${esc(CLUES[c].name)}</button>`;
      }).join('')}</div>` : '<div class="empty">You have no clues yet.</div>'}`);
  }

  if (ui === 'notebook') {
    const group = type => S.clues.filter(c => CLUES[c].type === type);
    const list = type => group(type).map(c => `<div class="clue"><b>${esc(CLUES[c].name)}</b> <small>&middot; ${esc(CLUES[c].where)}</small><br>${esc(CLUES[c].text)}</div>`).join('') || '<div class="empty">Nothing yet.</div>';
    return wrapModal(`
      <h2>Notebook</h2>
      <div class="label">Suspect board (tap to mark)</div>
      <div class="board">${SUSPECTS.map(id => `<div class="row"><span>${PEOPLE[id].icon} ${esc(PEOPLE[id].name)}</span><button class="mark s${S.marks[id] || 0}" data-act="mark" data-id="${id}">${MARK_LABELS[S.marks[id] || 0]}</button></div>`).join('')}</div>
      <div class="label">Evidence</div>${list('Evidence')}
      <div class="label">Testimony</div>${list('Testimony')}`);
  }

  if (ui === 'accuse') {
    const radio = (name, val, label) => `<label><input type="radio" name="${name}" data-acc="${name}" value="${esc(val)}" ${S.acc[name] === val ? 'checked' : ''}>${esc(label)}</label>`;
    return wrapModal(`
      <h2>Make your accusation</h2>
      <p>Accusations left: <span class="stars">${'★'.repeat(S.attempts)}${'☆'.repeat(3 - S.attempts)}</span></p>
      ${S.result !== null ? `<div class="result">Not quite. <b>${S.result} of 3</b> parts of your accusation are right. Keep digging.</div>` : ''}
      <fieldset><legend>Who did it?</legend>${SUSPECTS.map(id => radio('who', id, PEOPLE[id].name)).join('')}</fieldset>
      <fieldset><legend>How?</legend>${WEAPONS.map(w => radio('weapon', w, w)).join('')}</fieldset>
      <fieldset><legend>Why?</legend>${MOTIVES.map(m => radio('motive', m, m)).join('')}</fieldset>
      <button class="btn gold" data-act="submit">Accuse</button>`);
  }

  if (ui === 'end') {
    const win = S.over === 'win';
    const used = 3 - S.attempts;
    const rank = used === 1 && S.hints <= 1 ? 'Master Detective' : used === 1 ? 'Inspector' : used === 2 ? 'Sergeant' : 'Constable';
    return wrapModal(win ? `
      <h2>Case closed</h2>
      <p>Dr. Julian Hale was arrested before the snow cleared. Edmund had discovered that Hale was stealing from the Hartley Orphans' Fund and forging the signatures. Hale added digitalis to his own glass, brought it into the study, and switched glasses when Edmund turned to the decanter. His alibi collapsed when Vivian and the ashtray both contradicted it.</p>
      <p class="stars">${'★'.repeat(S.attempts)}${'☆'.repeat(3 - S.attempts)}</p>
      <p>Rank: <b>${rank}</b><br>Clues found: ${S.clues.length}/${Object.keys(CLUES).length} &middot; Moves: ${S.actions} &middot; Hints: ${S.hints}</p>
      <button class="btn gold" data-act="restart">Play again</button>` : `
      <h2>The killer got away</h2>
      <p>Your accusations ran out and the snow melted. The truth: <b>Dr. Julian Hale</b> poisoned Edmund with <b>digitalis in the brandy</b> to <b>cover up his theft from the Orphans' Fund</b>. The ashtray, the vial, Vivian's testimony and the second glass all pointed his way.</p>
      <button class="btn gold" data-act="restart">Try again</button>`, false);
  }
  return '';
}

render();
</script>
</body>
</html>
